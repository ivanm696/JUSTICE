version: '3.8'

services:
  # Ваш Node.js + Express сервер
  api:
    build: .
    container_name: justice_api
    restart: unless-stopped
    ports:
      - "5000:5000" # Замените 5000 на порт, который слушает ваш Express-сервер
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=justice_db
      - DB_USER=postgres
      - DB_PASSWORD=secretpassword
      - JWT_SECRET=your_jwt_secret_key_here
      # Настройки для отправки писем (например, SMTP)
      - SMTP_HOST=smtp.example.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@example.com
      - SMTP_PASS=your_email_password
    depends_on:
      - db
    networks:
      - justice_network

  # База данных (в примере PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: justice_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: justice_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432" # Опционально: если хотите подключаться извне (например, из DBeaver)
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - justice_network

# Изолированная сеть, чтобы контейнеры видели друг друга по именам (api и db)
networks:
- justice_network:
    driver: bridge

# Постоянное хранилище для базы данных, чтобы данные не стирались при перезапуске
volumes:
  pgdata:
